name: Verify and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Shell syntax and installation plan
        run: |
          for file in bootstrap-ubuntu.sh setup-ubuntu.sh install-web.sh scripts/*.sh; do bash -n "$file"; done
          bash bootstrap-ubuntu.sh --plan
      - run: python3 scripts/build-release.py
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: python3 scripts/build-release.py --tag "$GITHUB_REF_NAME"
      - name: Publish private release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "LocalForge $GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md
